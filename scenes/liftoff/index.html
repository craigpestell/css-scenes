<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Liftoff</title>
<!--css-->
<main class="stage" aria-label="A rocket on a launch pad. Scrolling counts it down, lifts it off, drops its booster and carries it up through the clouds into space.">
<div class="sky" aria-hidden="true"></div>
<div class="stars" aria-hidden="true"></div>
<div class="clouds" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="ground" aria-hidden="true"><div class="tower"></div><div class="smoke"><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i></div></div>
<div class="rocket" aria-hidden="true"><div class="engine"></div><div class="upper"></div><div class="booster"><div class="flame"></div></div></div>
<p class="hud" aria-hidden="true"></p>
<p class="hint">Scroll to launch</p>
</main>
<div class="runway" aria-hidden="true"></div>
