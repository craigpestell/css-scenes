<title>Pixelator</title>

<main class="stage" aria-label="A photo of Michelangelo's David behind a wall of glass blocks. Each block is a small lens that squeezes a wider view of the statue into itself, so the figure breaks up and repeats from block to block. A Lens slider takes the blocks from that wide view, through clear glass, to flat pixels, and a second slider sets their size. Point at a block to press it flat, or swap in a photo of your own.">

<div class="photo" role="img" aria-label="Michelangelo's David in the Galleria dell'Accademia, Florence"></div>

<div class="dials" role="group" aria-label="Glass">
<label for="block">Block size</label>
<input type="range" id="block" data-var="--block" min="0" max="1" step="0.01" value="0.55">
<output for="block" aria-hidden="true"></output>
<label for="lens">Lens</label>
<input type="range" id="lens" data-var="--lens" min="0" max="1" step="0.005" value="0.19" aria-describedby="lens-ends">
<span id="lens-ends">wide, clear, pixel</span>
<label class="glass"><input type="checkbox" id="glass" checked>Glass blocks</label>
</div>
<div class="tools" role="group" aria-label="Photo" hidden>
<label class="pick"><input type="file" accept="image/*">Use your photo</label>
<button type="button" class="back">Back to David</button>
<p class="note" aria-live="polite">Your photo never leaves this device.</p>
